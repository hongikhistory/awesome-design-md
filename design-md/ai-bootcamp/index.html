<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bootcamp Preview</title>
<meta http-equiv="refresh" content="0; url=./preview.html">
<style>
  :root {
    color-scheme: light dark;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #0f172a;
    color: #e5e7eb;
  }

  .card {
    width: min(560px, 100%);
    padding: 28px;
    border-radius: 20px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(148, 163, 184, 0.22);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.1;
  }

  p {
    margin: 0 0 18px;
    color: #cbd5e1;
    line-height: 1.6;
  }

  .links {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
  }

  .primary {
    background: #ffffff;
    color: #111827;
  }

  .secondary {
    background: transparent;
    color: #e5e7eb;
    border: 1px solid rgba(148, 163, 184, 0.35);
  }

  .tertiary {
    background: rgba(148, 163, 184, 0.12);
    color: #e5e7eb;
    border: 1px solid rgba(148, 163, 184, 0.12);
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Opening AI Bootcamp preview...</h1>
    <p>If the redirect does not happen automatically, use one of the links below.</p>
    <div class="links">
      <a class="primary" href="./preview.html">Open light mode</a>
      <a class="secondary" href="./preview-dark.html">Open dark mode</a>
      <a class="tertiary" href="./admin.html">Open admin dashboard</a>
    </div>
  </main>
</body>
</html>
